name: Bug report
description: Report incorrect behavior, a crash, or a documentation error
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug, including the file/line if known.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Minimal code snippet or commands that trigger the issue.
      render: python
    validations:
      required: false

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: false

  - type: input
    id: version
    attributes:
      label: PyOMES version / commit
    validations:
      required: false

  - type: input
    id: python-version
    attributes:
      label: Python version
    validations:
      required: false
